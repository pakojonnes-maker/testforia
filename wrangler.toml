name = "visualtasteworker"
main = "worker.js"
compatibility_date = "2023-10-30"

[vars]
# Add environment variables here if needed

[[d1_databases]]
binding = "DB"
database_name = "restaurant-menu-saas"
database_id = "7e8d1efe-2a54-4849-9a06-4c47152392bd"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "mediabucket"

# KV namespace for guidebook payload caching (TTL 15 min per entry)
# Create with: wrangler kv namespace create GUIDE_CACHE
# Then update the id below with the output
[[kv_namespaces]]
binding = "GUIDE_CACHE"
id = "89c387501e00410b9d4f0d80dc563bf2"

# Contadores de rate limiting (login y PIN de fidelidad). Entradas efímeras con
# expirationTtl; nada aquí es fuente de verdad ni sobrevive a su ventana.
# Ojo: workerLoyalty.js ya esperaba este binding y, al no existir, su límite de
# intentos de PIN nunca llegó a aplicarse.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c8456e9e79794fe796c9a09ab5405d29"

# Workers AI binding for the guidebook AI assistant
[ai]
binding = "AI"
