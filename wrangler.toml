name = "visualtasteworker"
main = "worker.js"
compatibility_date = "2023-10-30"

# Purga de analítica del guidebook (ver scheduled() en worker.js). La política de
# privacidad publicada promete conservar la analítica 12 meses desde la última
# visita; sin esto era solo una promesa, porque nada borraba nunca esas filas.
# 04:17 UTC y no en punto: a las horas redondas se concentran los crons de toda
# la plataforma y las colas de D1 son peores.
[triggers]
crons = ["17 4 * * *"]

# Historial de logs (Workers Logs). Sin esto solo existía `wrangler tail`, que
# enseña lo que pasa mientras alguien mira: un 500 de anoche o el cron de las
# 04:17 no dejaban rastro. Plan Free: 200.000 eventos/día y 3 días; al llegar al
# tope deja de guardar, no cobra ni afecta a las peticiones.
[observability]
enabled = true

[vars]
# WhatsApp que recibe los pedidos de productos owner_type='platform' en la
# Tienda del guidebook (aceite, queso...).
PLATFORM_WHATSAPP = "+34633747033"

# Login con Google del superadmin (workerGoogleAuth.js). Ninguna de las dos es
# secreta: el Client ID viaja en el navegador de cualquier web con Google Sign-In
# y la lista solo dice quién puede usar el botón. Con GOOGLE_CLIENT_ID vacío el
# botón no aparece y /auth/google responde 503, así que esto se puede desplegar
# antes de crearlo. Se crea en Google Cloud Console → APIs y servicios →
# Credenciales → ID de cliente de OAuth (Aplicación web), con estos orígenes
# JavaScript autorizados: https://admin.visualtastes.com, http://localhost y
# http://localhost:5174 (sin URIs de redireccionamiento: aquí no hay redirección).
GOOGLE_CLIENT_ID = ""
GOOGLE_ADMIN_EMAILS = "franciscotortosaestudios@gmail.com"

# Dominio propio del bucket de media (workerMediaUrl.js). Vacío = todo sigue
# saliendo por /media/ de este worker, como siempre. Con un origen https (sin
# barra final ni ruta), las guías, la tele y la carta reciben las fotos y los
# vídeos con ese dominio y los sirve la CDN sin ejecutar el worker.
# El dominio tiene que estar conectado al bucket (R2 → mediabucket → Settings →
# Custom Domains; conectado el 2026-10-13) y comprobado con un curl a una foto y
# a un vídeo: si no, todas las imágenes dan error a la vez. Vaciarlo y desplegar
# lo deshace al instante: lo cacheado en KV no guarda este dominio.
MEDIA_BASE_URL = "https://media.visualtastes.com"

[[d1_databases]]
binding = "DB"
database_name = "restaurant-menu-saas"
database_id = "7e8d1efe-2a54-4849-9a06-4c47152392bd"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "mediabucket"

# KV namespace for guidebook payload caching (TTL 15 min per entry)
# Create with: wrangler kv namespace create GUIDE_CACHE
# Then update the id below with the output
[[kv_namespaces]]
binding = "GUIDE_CACHE"
id = "89c387501e00410b9d4f0d80dc563bf2"

# Tickets de MFA, caché de token_version y los contadores de rutas CON sesión
# (importadores, traductor, intentos de MFA). Entradas efímeras con
# expirationTtl; nada aquí es fuente de verdad ni sobrevive a su ventana.
# Las rutas públicas (login, PIN de sellos) ya NO cuentan aquí: cada intento
# gastaba una de las 1.000 escrituras diarias que comparte con GUIDE_CACHE.
# Ver AUTH_IP_LIMITER más abajo.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c8456e9e79794fe796c9a09ab5405d29"

# Workers AI binding for the guidebook AI assistant
[ai]
binding = "AI"

# Frenos por minuto del chat IA del guidebook (workerGuideAI.js). Van con el
# binding nativo y NO con RATE_LIMIT_KV: en el plan Free KV admite 1.000
# escrituras/día para toda la cuenta, y el chat hacía 4 por mensaje. Son por
# ubicación y aproximados; el tope real del gasto es el presupuesto en neuronas
# de workerAiBudget.js (D1). period solo admite 10 o 60.
[[ratelimits]]
name = "AI_CHAT_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AI_CHAT_VISITOR_LIMITER"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

# Escrituras públicas del flujo de reservas de la carta (crear, lista de espera,
# cancelar por token), por IP. Una persona real hace dos o tres por visita; esto
# solo frena a quien las automatice. Mismo motivo que arriba para no usar KV.
[[ratelimits]]
name = "RESERVATION_IP_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Primera barrera del login (contraseña y Google) y del PIN de sellos, por IP:
# la clave lleva el ámbito delante (`login:<ip>`), así que cada uno cuenta
# aparte. No sustituye a las ventanas largas (5 fallos/15 min, 30/hora), que se
# cuentan en security_audit_log: solo acota cuántas filas puede hacer escribir
# ahí una misma IP.
[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }
