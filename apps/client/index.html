<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Sin maximum-scale ni user-scalable=no: quien necesita ampliar para leer los alérgenos tiene que poder. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- Apple PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VisualTaste">

  <!-- Open Graph / WhatsApp Preview. Este index.html es la landing de la carta digital para restaurantes
       (menu.visualtastes.com/): la landing central de visualtastes.com/ es central/index.html. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VisualTaste" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:url" content="https://menu.visualtastes.com/" />
  <meta property="og:title" content="Carta digital con QR y vídeo para restaurantes | VisualTaste" />
  <meta property="og:description"
    content="Carta digital con QR y vídeo para restaurantes: tus platos en vídeo, traducción automática a 13 idiomas, alérgenos, reservas y pedidos. Sin app para el cliente." />
  <meta property="og:image" content="https://menu.visualtastes.com/og-image.png?v=3" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta property="twitter:card" content="summary_large_image" />

  <!-- Iconos de verdad (oct-2026): antes los cuatro eran el mismo JPEG de 1024 px y 455 KB con otra extensión. -->
  <link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
  <link rel="manifest" href="/manifest.json?v=4">
  <title>Carta digital con QR y vídeo para restaurantes | VisualTaste</title>
  <meta name="description"
    content="Carta digital con QR y vídeo para restaurantes: tus platos en vídeo, traducción automática a 13 idiomas, alérgenos, reservas y pedidos. Sin app para el cliente." />
  <!-- Las fuentes van autoalojadas (@fontsource): nada de Google Fonts, que bloqueaba el primer
       pintado y mandaba la IP de cada visitante a Google. -->
  <!-- Datos estructurados de la portada de la carta (menu.visualtastes.com/). La organización lleva el mismo
       @id en visualtastes.com (landing central), guide. y tv.: es una sola entidad con varios productos. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://visualtastes.com/#organization",
        "name": "VisualTaste",
        "url": "https://visualtastes.com/",
        "logo": "https://visualtastes.com/logo.png",
        "email": "info@visualtastes.com"
      },
      {
        "@type": "WebSite",
        "@id": "https://menu.visualtastes.com/#website",
        "url": "https://menu.visualtastes.com/",
        "name": "VisualTaste Carta",
        "inLanguage": "es",
        "publisher": { "@id": "https://visualtastes.com/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://menu.visualtastes.com/#app",
        "name": "VisualTaste Carta",
        "url": "https://menu.visualtastes.com/",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Carta digital con QR para restaurantes",
        "operatingSystem": "Web",
        "description": "Carta digital con QR y vídeo para restaurantes, con traducción automática de la carta y panel de gestión.",
        "publisher": { "@id": "https://visualtastes.com/#organization" }
      }
    ]
  }
  </script>
  <script>
    /* Un solo build sirve visualtastes.com, www. y menu. (y visualtaste.pages.dev): el canonical dice cuál es la
       dirección buena. Se pone desde aquí y no fijo en el HTML porque este index.html sirve tres cosas:
       - «/»: la landing de la carta digital para restaurantes. Su dirección es menu.visualtastes.com/ en cualquier
         host (en visualtastes.com/ sale otra página: la central, ver public/_worker.js). Conserva el JSON-LD.
       - /<slug> en visualtastes.com: la landing de cada restaurante, con su propia dirección.
       - /<slug> en menu.: la carta (noindex en public/_headers). Sin canonical.
       El JSON-LD y el og:url de arriba describen la portada: fuera de «/» sobran. */
    (function () {
      var p = location.pathname;
      var canonical = null;
      if (p === '/') canonical = 'https://menu.visualtastes.com/';
      else {
        var ld = document.querySelectorAll('script[type="application/ld+json"]');
        for (var i = 0; i < ld.length; i++) ld[i].parentNode.removeChild(ld[i]);
        if (location.hostname.indexOf('menu.') !== 0) canonical = 'https://visualtastes.com' + p;
        var og = document.querySelector('meta[property="og:url"]');
        if (og) { if (canonical) og.setAttribute('content', canonical); else og.parentNode.removeChild(og); }
      }
      if (!canonical) return;
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.href = canonical;
      document.head.appendChild(link);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
