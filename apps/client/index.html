<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Sin maximum-scale ni user-scalable=no: quien necesita ampliar para leer los alérgenos tiene que poder. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- Apple PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VisualTaste">

  <!-- Open Graph / WhatsApp Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="VisualTaste - Carta Digital QR con Video para Restaurantes" />
  <meta property="og:description"
    content="Menú digital interactivo con video 4K. Traducción automática, QR sin contacto y análisis de ventas. La carta del futuro para tu restaurante." />
  <meta property="og:image" content="/og-image.png?v=3" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta property="twitter:card" content="summary_large_image" />

  <!-- Iconos de verdad (oct-2026): antes los cuatro eran el mismo JPEG de 1024 px y 455 KB con otra extensión. -->
  <link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
  <link rel="manifest" href="/manifest.json?v=4">
  <title>Carta Digital QR para Restaurantes | VisualTaste - Menú con Video 4K</title>
  <meta name="description"
    content="Crea tu carta digital QR con VisualTaste. Menú interactivo con video 4K, traducción automática a 14 idiomas y gestión de pedidos. Aumenta tus ventas +15% con la mejor carta digital para restaurantes." />
  <!-- Las fuentes van autoalojadas (@fontsource): nada de Google Fonts, que bloqueaba el primer
       pintado y mandaba la IP de cada visitante a Google. -->
  <!-- Datos estructurados de la portada. La organización lleva el mismo @id en guide.visualtastes.com y
       tv.visualtastes.com: es una sola entidad con tres productos. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://visualtastes.com/#organization",
        "name": "VisualTaste",
        "url": "https://visualtastes.com/",
        "logo": "https://visualtastes.com/logo.png",
        "email": "info@visualtastes.com"
      },
      {
        "@type": "WebSite",
        "@id": "https://visualtastes.com/#website",
        "url": "https://visualtastes.com/",
        "name": "VisualTaste",
        "inLanguage": "es",
        "publisher": { "@id": "https://visualtastes.com/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://visualtastes.com/#app",
        "name": "VisualTaste Carta",
        "url": "https://visualtastes.com/",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Carta digital con QR para restaurantes",
        "operatingSystem": "Web",
        "description": "Carta digital con QR y vídeo para restaurantes, con traducción automática de la carta y panel de gestión.",
        "publisher": { "@id": "https://visualtastes.com/#organization" }
      }
    ]
  }
  </script>
  <script>
    /* Un solo build sirve visualtastes.com, www. y menu. (y visualtaste.pages.dev): el canonical dice cuál es la
       dirección buena. Se pone desde aquí y no fijo en el HTML porque este index.html también es la landing de
       cada restaurante (/<slug>), que tiene su propia dirección. menu. no lleva: es la app de la carta, con
       noindex (public/_headers). El JSON-LD de arriba describe la portada: fuera de / sobra. */
    (function () {
      var p = location.pathname;
      if (p !== '/') {
        var ld = document.querySelectorAll('script[type="application/ld+json"]');
        for (var i = 0; i < ld.length; i++) ld[i].parentNode.removeChild(ld[i]);
      }
      if (location.hostname.indexOf('menu.') === 0) return;
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.href = 'https://visualtastes.com' + p;
      document.head.appendChild(link);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
